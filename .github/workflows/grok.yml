name: grok

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grok-only text
        run: python3 scripts/check-grok
      - name: Upstream classifier self-test
        run: python3 scripts/check-upstream --self-test
      - name: Upstream drift report
        run: python3 scripts/check-upstream
