name: grok

on:
  push:
  pull_request:

# check-upstream is not run here. Upstream commits are not this repo's
# failures, and the owner runs the daily upstream check outside this repo.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Verify setup
        run: python3 scripts/verify-setup
      - name: poteto-mode script tests
        working-directory: .cursor/skills/poteto-mode/scripts
        run: |
          bun install --frozen-lockfile
          bun test
          bun run typecheck
